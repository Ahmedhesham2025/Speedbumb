# Builds the APK on GitHub's servers every time you push (or when you press "Run workflow").
# Download it from the run's page → Artifacts → BumpBeeper-apk.
#
# Signing: the APK is signed with your own fixed key, stored in the repository secrets
# KEYSTORE_BASE64 and KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions).
# Same key every time = each new version installs over the old one and keeps your bumps.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Simulated-drive tests
        run: chmod +x gradlew && ./gradlew :core:test testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing, so the APK can't be signed with your fixed key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "BUMP_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          BUMP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "BumpBeeper-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BumpBeeper-apk
          path: BumpBeeper-${{ github.run_number }}.apk

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
