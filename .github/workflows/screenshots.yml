# Real screenshots of the app (English + Arabic) for the owner and the store listings, taken on a free
# GitHub-hosted emulator. Not part of ci-gate, so pull requests are never slowed down by it.
#
# app/src/androidTest/.../ScreenshotTest.kt seeds demo bumps and trips around Cairo, opens every tab and saves PNGs;
# this workflow runs it once per language and uploads them as the `screenshots` artifact (screenshots/en, screenshots/ar).
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/src/main/**']
  pull_request:
    paths: ['.github/workflows/screenshots.yml', 'app/src/androidTest/**']

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Built before the emulator starts, so the emulator only runs the test.
      - name: Build the app and the screenshot test (foss debug)
        run: chmod +x gradlew && ./gradlew assembleFossDebug assembleFossDebugAndroidTest

      # Hardware acceleration for the emulator (from the android-emulator-runner README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action runs its `script` line by line, so the real steps live in one bash file.
      - name: Write the emulator script
        run: |
          cat > "$RUNNER_TEMP/shots.sh" <<'EOF'
          set -euo pipefail
          PKG=app.bumpbeeper.dev
          REMOTE=/sdcard/Android/data/$PKG/files/screenshots
          adb wait-for-device
          adb shell input keyevent 82 || true
          adb shell wm dismiss-keyguard || true
          # A freshly booted emulator often shows "Pixel Launcher isn't responding" over the app:
          # never show crash/ANR dialogs, and give the launcher time to settle first.
          adb shell settings put global hide_error_dialogs 1 || true
          sleep 30
          adb shell input keyevent KEYCODE_HOME || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null || true
          # No network: the demo must not sign in to the real shared map, nor show an "update available" banner.
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          # Clean status bar for store images: 12:00, full battery, full signal, no notification icons.
          adb shell settings put global sysui_demo_allowed 1 || true
          demo() { adb shell am broadcast -a com.android.systemui.demo -e command "$@" >/dev/null || true; }
          demo enter
          demo clock -e hhmm 1200
          demo battery -e level 100 -e plugged false
          demo network -e mobile show -e level 4 -e datatype none
          demo network -e wifi hide
          demo notifications -e visible false
          adb install -r app/build/outputs/apk/foss/debug/app-foss-debug.apk
          adb install -r app/build/outputs/apk/androidTest/foss/debug/app-foss-debug-androidTest.apk
          mkdir -p shots
          pass() {
            # Per-app language (Android 13+); the app process starts fresh for each pass.
            adb shell am force-stop $PKG || true
            adb shell cmd locale set-app-locales $PKG --locales "$1"
            out=$(adb shell am instrument -w -e class app.bumpbeeper.ScreenshotTest $PKG.test/androidx.test.runner.AndroidJUnitRunner)
            echo "$out"
            echo "$out" | grep -q "OK (1 test)" || { echo "::error::Screenshot test failed for $1"; return 1; }
            rm -rf pulled
            adb pull "$REMOTE" pulled
            cp -r pulled/. shots/
          }
          pass en-US
          pass ar-EG
          ls -lR shots
          EOF

      - name: Take the screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/shots.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/
          if-no-files-found: error
          retention-days: 30
