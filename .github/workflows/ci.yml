# Checks every pull request and every push to main. No secrets here: signed builds only happen in release.yml.
#
# Only the jobs whose files changed run; `ci-gate` sums them up and is the single required check for merging.
# Every PR that touches the app gets a debug APK (package app.bumpbeeper.dev) under the run's Artifacts:
# it installs next to the real app, so testing it never touches your saved bumps.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # paths-filter reads the PR's changed files

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      app: ${{ steps.filter.outputs.app }}
      ci: ${{ steps.filter.outputs.ci }}
      replay: ${{ steps.filter.outputs.replay }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            app:
              - 'app/**'
              - '*.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
            ci:
              - '.github/**'
            replay:
              - 'tools/replay/**'
            backend:
              - 'supabase/**'

  core-test:
    needs: changes
    # Pushes to main and manual runs always test everything.
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.replay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Simulated-drive and replay tests
        run: chmod +x gradlew && ./gradlew :core:test :tools:replay:test
      - name: Test count
        if: always()
        run: |
          # Sum the JUnit XML results so the number of tests shows in the log and on the run page.
          files=$(find core/build/test-results tools/replay/build/test-results -name 'TEST-*.xml' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No test results found."; exit 0; fi
          sum() { grep -ho "<testsuite [^>]*" $files | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          line="core + replay tests: $(sum tests) run, $(sum failures) failed, $(sum errors) errors, $(sum skipped) skipped"
          echo "$line"
          echo "### $line" >> "$GITHUB_STEP_SUMMARY"

  app-build:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      APK_NAME: BumpBeeper-dev-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # Unit tests first: a failing test stops the job before an APK is built.
      # Both editions (#48): foss (no libraries) and play (+ Google Play services location).
      - name: App unit tests (foss + play)
        run: chmod +x gradlew && (./gradlew -q :app:printTestCp | grep CP; ./gradlew :app:compileFossDebugUnitTestKotlin | grep -E 'KLIB' ) ; exit 1
      - name: App test count
        if: always()
        run: |
          for v in Foss Play; do
            files=$(find "app/build/test-results/test${v}DebugUnitTest" -name 'TEST-*.xml' 2>/dev/null || true)
            if [ -z "$files" ]; then echo "No $v app test results found (no tests yet?)."; continue; fi
            sum() { grep -ho "<testsuite [^>]*" $files | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
            line="app unit tests ($v): $(sum tests) run, $(sum failures) failed, $(sum errors) errors, $(sum skipped) skipped"
            echo "$line"
            echo "### $line" >> "$GITHUB_STEP_SUMMARY"
          done
      # Hard rule 2: the foss edition ships only Android APIs + :core + MapLibre Native (BSD-2, the street map; owner
      # decision 2026-10-03). Its only direct libraries may be :core and org.maplibre.gl:android-sdk-opengl, and every
      # library on the release runtime classpath must be listed in .github/foss-runtime-allowlist.txt (MapLibre's own
      # transitive libraries, by group:artifact). Anything else fails the job. The play edition may add Google Play services.
      - name: No runtime libraries in the foss edition (except MapLibre)
        run: |
          ./gradlew -q :app:dependencies --configuration fossReleaseRuntimeClasspath > foss-deps.txt
          cat foss-deps.txt
          # Every resolved node: "project :core" or "group:artifact:version" (tree prefixes stripped).
          nodes=$(grep -E '^[|+\\ ]*[+\\]--- ' foss-deps.txt | sed -E 's/^[|+\\ -]*//; s/ \(.*$//; s/ -> .*$//' | sort -u)
          # Direct dependencies: the tree's top level ("+--- x" / "\--- x" at column 0), as group:artifact.
          direct=$(grep -E '^[+\\]--- ' foss-deps.txt | sed -E 's/^[+\\]--- //; s/ \(.*$//; s/ -> .*$//; s/^([^:]+:[^:]+):.*/\1/' | sort -u)
          if [ -z "$nodes" ] || ! echo "$nodes" | grep -q '^project :core$'; then
            echo "::error::Could not read the foss runtime classpath (expected at least project :core)."
            exit 1
          fi
          bad_direct=$(echo "$direct" | grep -vxE 'project :core|org\.maplibre\.gl:android-sdk-opengl|org\.jetbrains\.kotlin:kotlin-stdlib' || true)
          if [ -n "$bad_direct" ]; then
            echo "::error::The foss edition may only add MapLibre. New direct runtime libraries:"
            echo "$bad_direct"
            exit 1
          fi
          allowed=$(grep -vE '^\s*(#|$)' .github/foss-runtime-allowlist.txt | sed -E 's/\s+$//')
          bad=$(echo "$nodes" | grep -v '^project :core$' | sed -E 's/^([^:]+:[^:]+):.*/\1/' | sort -u | grep -vxFf <(echo "$allowed") || true)
          if [ -n "$bad" ]; then
            echo "::error::The foss edition must not ship runtime libraries beyond MapLibre and its own. Not in the allowlist:"
            echo "$bad"
            exit 1
          fi
          echo "foss runtime classpath OK ($(echo "$nodes" | wc -l) libraries): $(echo "$nodes" | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build debug APKs (foss + play)
        run: ./gradlew assembleFossDebug assemblePlayDebug
      # Lint reports existing issues without blocking merges yet; the reports are uploaded below.
      - name: Lint (not blocking yet)
        continue-on-error: true
        run: ./gradlew lintFossDebug lintPlayDebug
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk "$APK_NAME-foss.apk"
          cp app/build/outputs/apk/play/debug/app-play-debug.apk "$APK_NAME-google.apk"
          ls -l "$APK_NAME"-*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}-foss
          path: ${{ env.APK_NAME }}-foss.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}-google
          path: ${{ env.APK_NAME }}-google.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-fossDebug.html
            app/build/reports/lint-results-playDebug.html
          if-no-files-found: ignore
          retention-days: 14

  # Local Supabase (Docker on the runner, free): migrations must apply, lint clean at error level, pgTAP tests pass.
  # Expects supabase/config.toml, supabase/migrations/*.sql and supabase/tests/*.sql (pgTAP).
  # Also runs the Edge Functions' Deno tests, type check and lint (supabase/functions/**, covered by the backend filter).
  backend:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Edge Functions (supabase/functions/*): offline Deno unit tests, type check and lint. No secrets needed.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests (Deno)
        run: deno test supabase/functions/
      - name: Edge Function type check (Deno)
        run: deno check supabase/functions/*/index.ts
      - name: Edge Function lint (Deno)
        run: deno lint supabase/functions/
      - name: Is there a backend yet?
        id: present
        run: |
          if [ -f supabase/config.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/config.toml yet: nothing to test, skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: supabase/setup-cli@v3
        if: steps.present.outputs.found == 'true'
        with:
          version: 2.119.0
      - name: Start local Supabase (database services only)
        if: steps.present.outputs.found == 'true'
        run: |
          supabase --version
          # Skip the containers the tests don't need. Only pass names this CLI version knows
          # (e.g. inbucket was renamed mailpit), so a CLI update can't break the job.
          help=$(supabase start --help)
          exclude=""
          for c in studio imgproxy inbucket mailpit edge-runtime logflare vector supavisor; do
            if echo "$help" | grep -qw -- "$c"; then exclude="${exclude:+$exclude,}$c"; fi
          done
          echo "Excluding: ${exclude:-nothing}"
          if [ -n "$exclude" ]; then supabase start -x "$exclude"; else supabase start; fi
      - name: Lint database (errors fail the job)
        if: steps.present.outputs.found == 'true'
        run: supabase db lint --schema public --level error --fail-on error
      - name: pgTAP tests
        if: steps.present.outputs.found == 'true'
        run: |
          if ls supabase/tests/*.sql >/dev/null 2>&1 || find supabase/tests -name '*.sql' 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "No pgTAP tests in supabase/tests yet." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop Supabase
        if: always() && steps.present.outputs.found == 'true'
        run: supabase stop --no-backup || true

  # The one required check. Skipped jobs (nothing relevant changed) count as fine.
  ci-gate:
    needs: [changes, core-test, app-build, backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All needed jobs passed or were skipped
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.core-test.result }} ${{ needs.app-build.result }} ${{ needs.backend.result }}
        run: |
          echo "changes / core-test / app-build / backend: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job ended with '$r'."
              exit 1
            fi
          done
