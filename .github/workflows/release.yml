# Builds, signs and publishes a release when the lead pushes a tag like v1.2.0 (stable) or v1.2.0-beta1 (beta).
# Download it from the Releases page (https://github.com/Ahmedhesham2025/Speedbumb/releases).
#
# Signing: the APK is signed with your own fixed key, stored in the repository secrets
# KEYSTORE_BASE64 and KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions).
# Same key every time = each new version installs over the old one and keeps your bumps.
# The version comes from the tag (see app/build.gradle.kts): v1.2.0 → versionName 1.2.0, versionCode 1020099;
# v1.2.0-beta3 → versionName 1.2.0-beta3, versionCode 1020003.
# A beta is published as a GitHub pre-release: never "Latest", so the app's update check (releases/latest) skips it,
# and Obtainium with "Include prereleases" installs it (README, "Beta builds").
name: Release

on:
  push:
    tags: ['v*.*.*']   # also matches betas: v1.2.0-beta1

permissions:
  contents: write   # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          # Stable vX.Y.Z, or beta vX.Y.Z-betaN with N from 1 to 98 (99 is the stable release's slot in the versionCode).
          if [[ "$VERSION_NAME" =~ ^([0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2})(-beta([1-9][0-9]?))?$ ]] && [ "${BASH_REMATCH[3]:-0}" -le 98 ]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            BETA_NUMBER="${BASH_REMATCH[3]}"
          else
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-betaN (major below 1000, minor and patch below 100, N from 1 to 98)."
            exit 1
          fi
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "BASE_VERSION=$BASE_VERSION"
            echo "BETA_NUMBER=$BETA_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Simulated-drive tests
        run: chmod +x gradlew && ./gradlew :core:test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing, so the APK can't be signed with your fixed key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "BUMP_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          BUMP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Without the password Gradle would quietly fall back to the debug key; a release must never do that.
          if [ -z "$BUMP_KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi
          ./gradlew assembleFossRelease assemblePlayRelease

      # Two editions (#48), same key: foss = no libraries (also for F-Droid / AppGallery), -google = play edition.
      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "BumpBeeper-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/play/release/app-play-release.apk "BumpBeeper-${VERSION_NAME}-google.apk"

      # Stable: a full release, which GitHub makes "Latest". Beta: a pre-release, which GitHub never makes "Latest".
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BETA_NUMBER" ]; then
            gh release create "$GITHUB_REF_NAME" BumpBeeper-*.apk --title "Bump Beeper $BASE_VERSION beta $BETA_NUMBER" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" BumpBeeper-*.apk --title "Bump Beeper $VERSION_NAME" --generate-notes
          fi

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
