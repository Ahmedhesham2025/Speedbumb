# Keeps the free Supabase project awake: free projects pause after 7 days of inactivity.
# Note: GitHub may disable scheduled workflows in a repo with no commits for 60 days;
# if that happens the owner re-enables this workflow in the Actions tab.
name: keepalive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (public endpoints, publishable key only)
        run: |
          KEY="sb_publishable_Oo5L_qbPGCBzXVSlyFz5ow_I6vFuhRl"
          BASE="https://gpefcdyuipmspezbsano.supabase.co"
          curl -fsS "$BASE/auth/v1/health" -H "apikey: $KEY"
          echo
          # Any HTTP status is fine here; it still counts as activity.
          curl -sS -o /dev/null -w "rest: %{http_code}\n" "$BASE/rest/v1/" -H "apikey: $KEY"
