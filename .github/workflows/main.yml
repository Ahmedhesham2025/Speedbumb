# Builds the APK on GitHub's servers every time you push (or when you press "Run workflow").
# Download it from the run's page → Artifacts → BumpBeeper-apk.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Simulated-drive tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BumpBeeper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
