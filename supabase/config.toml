# Local Supabase settings for `supabase start` (CI and developer machines only).
# The hosted project is configured in its dashboard; nothing here is pushed to it.
project_id = "bumpbeeper"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
# The app signs in anonymously: no email, phone or name is ever collected from drivers.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false
